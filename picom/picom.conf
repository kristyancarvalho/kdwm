backend = "xrender";
vsync = true;
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.28;
shadow-offset-x = -4;
shadow-offset-y = -4;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
fading = false;
use-damage = false;
detect-rounded-corners = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
shadow-exclude = [ "name = 'dwm'", "class_g = 'dwm'", "window_type = 'dock'", "window_type = 'desktop'" ];
wintypes:
{
  dock = { shadow = false; };
  desktop = { shadow = false; };
  popup_menu = { opacity = 0.96; };
};
