# Kept intentionally lightweight for an X11 VM desktop.
backend = "xrender";
vsync = true;
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.28;
shadow-offset-x = -4;
shadow-offset-y = -4;
inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 1.0;
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
detect-rounded-corners = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
wintypes:
{
  dock = { shadow = false; };
  desktop = { shadow = false; };
  popup_menu = { opacity = 0.96; };
};
